name: Go Tests
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Install dependencies
        run: go get .
      - name: Test
        run: go test -v ./...
