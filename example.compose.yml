services:
  db:
    image: postgres:18
    container_name: sierra-postgres
    environment:
      # You should change this!
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - sierra-network
  sierra-api:
    # in the future it might be wise to add a "stable" tag or one for each game version
    # but for now this works well enough
    image: ghcr.io/subsurfacestudios/sierra-api:latest
    container_name: sierra-api
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - sierra-network
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  sierra-network:
    driver: bridge